    }).join('') + '</ol>' +
    '<div class="chart" id="chart"></div>';
  renderChart();
}

function renderChart() {
  var el = $('#chart');
  if (!el) return;
  var H = S.hands;
  if (H.length < 2) { el.innerHTML = ''; return; }
  var W = Math.max(280, Math.round(el.clientWidth || 340));
  var Ht = 190, padL = 50, padR = 12, padT = 12, padB = 26;
  var ids = order();
  var series = {}, min = 0, max = 0;
  ids.forEach(function (id) { series[id] = [0]; });
  H.forEach(function (h) {
    ids.forEach(function (id) {
      var arr = series[id];
      var v = arr[arr.length - 1] + (h.net[id] || 0);
      arr.push(v);
      if (v < min) min = v; if (v > max) max = v;
    });
  });
  if (max - min < 100) { max += 50; min -= 50; }
  var span = max - min;
  max += span * 0.06; min -= span * 0.06;
  function x(i) { return padL + i * (W - padL - padR) / H.length; }
  function y(v) { return padT + (max - v) * (Ht - padT - padB) / (max - min); }
  var lines = ids.map(function (id) {
    var pts = series[id].map(function (v, i) { return x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ');
    var last = series[id][series[id].length - 1];
    return '<polyline points="' + pts + '" fill="none" stroke="' + col(id) + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + x(H.length).toFixed(1) + '" cy="' + y(last).toFixed(1) + '" r="3.5" fill="' + col(id) + '"/>';
  }).join('');
  var tickMax = Math.max.apply(null, ids.map(function (id) { return Math.max.apply(null, series[id]); }));
  var tickMin = Math.min.apply(null, ids.map(function (id) { return Math.min.apply(null, series[id]); }));
  var labels = '';
  [[tickMax, tickMax > 0], [0, true], [tickMin, tickMin < 0]].forEach(function (t) {
    if (!t[1]) return;
    if (t[0] !== 0 && Math.abs(y(t[0]) - y(0)) < 14) return;
    labels += '<text x="' + (padL - 8) + '" y="' + (y(t[0]) + 4).toFixed(1) + '" text-anchor="end" fill="#9CB9AA" font-size="11.5" font-family="Archivo, Helvetica, Arial, sans-serif">' + (t[0] === 0 ? '\u00A30' : fmtS(t[0])) + '</text>';
  });
  var grid = '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '" stroke="rgba(238,241,232,.22)" stroke-dasharray="3 4"/>';
  var xl = '<text x="' + padL + '" y="' + (Ht - 6) + '" fill="#9CB9AA" font-size="11.5" font-family="Archivo, Helvetica, Arial, sans-serif">Start</text>' +
    '<text x="' + (W - padR) + '" y="' + (Ht - 6) + '" text-anchor="end" fill="#9CB9AA" font-size="11.5" font-family="Archivo, Helvetica, Arial, sans-serif">Hand ' + H.length + '</text>';
  el.innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + Ht + '" width="' + W + '" height="' + Ht + '" role="img" aria-label="Running profit and loss for each player across ' + H.length + ' hands">' +
      grid + labels + lines + xl + '</svg>' +
    '<div class="chart-legend" aria-hidden="true">' + ids.map(function (id) {
      return '<span><i style="--c:' + col(id) + '"></i>' + nm(id) + '</span>';
    }).join('') + '</div>';
}

function renderHistory() {
  var el = $('#history');
  var H = S.hands;
  var head = '<div class="sec-head"><h2 id="history-title">Hand history</h2>' +
    (H.length ? '<button type="button" class="btn-ghost sm" data-action="undo-hand">' + ICON_UNDO + 'Undo last hand</button>' : '') + '</div>';
  if (!H.length) {
    el.innerHTML = head + '<p class="empty">No hands yet. Record the first one and it\u2019ll appear here, newest at the top.</p>';
    return;
  }
  var ids = order();
  var rows = [];
  for (var i = H.length - 1; i >= 0; i--) {
    var h = H[i], n = i + 1;
    var cells = ids.map(function (id) {
      if (h.players.indexOf(id) < 0) return '<td class="outc">Out</td>';
      var pos = h.bbP === id ? 'BB' : h.sbP === id ? 'SB' : (h.button === id ? 'D' : '');
      var nt = h.net[id] || 0;
      var fd = h.folded && h.folded[id];
      return '<td' + (fd ? ' class="fd"' : '') + '><span class="b">' + (pos ? '<i>' + pos + '</i>' : '') + fmt(h.bets[id] || 0) + '</span>' +
        '<span class="pl ' + tone(nt) + '">' + fmtS(nt) + '</span></td>';
    }).join('');
    rows.push('<tr><th scope="row"><button type="button" class="hn" data-action="edit-hand" data-hid="' + h.id + '" aria-label="Edit hand ' + n + '">' + n + '</button></th>' +
      cells +
      '<td class="potc">' + fmt(h.pot) + '<span class="win">' + h.winners.map(nm).join(' & ') + (h.winners.length > 1 ? ' <em>split</em>' : '') + '</span></td></tr>');
  }
  el.innerHTML = head +
    '<div class="table-scroll"><table class="hist">' +
      '<thead><tr><th scope="col">Hand</th>' +
        ids.map(function (id) { return '<th scope="col"><span class="dot" style="--c:' + col(id) + '"></span>' + nm(id) + '</th>'; }).join('') +
        '<th scope="col">Pot<br>winner</th></tr></thead>' +
      '<tbody>' + rows.join('') + '</tbody></table></div>' +
    '<p class="note">Each player shows what they put in, with their profit or loss underneath. The pot column shows who won it. Tap a hand number to edit or delete it.</p>' +
    '<div class="sec-foot"><button type="button" class="btn-ghost sm" data-action="export-csv">Export hands (CSV)</button></div>';
}

/* =========================================================
   Actions
   ========================================================= */
function toggleOut(id) {
  if (!S.out[id]) {
    var remaining = order().filter(function (x) { return isIn(x) && x !== id; }).length;
    if (remaining < 2) { toast('At least two players need to be in to deal a hand.'); return; }
    S.out[id] = true;
  } else {
    delete S.out[id];
  }
  save();
  render();
}

function toggleFold(id) {
  var P = positions(), d = S.draft;
  if (!P.ok || !d) return;
  if (!d.folded[id]) {
    var left = P.active.filter(function (x) { return !d.folded[x] && x !== id; });
    if (left.length < 1) { toast('Someone has to win the pot.'); return; }
    d.folded[id] = true;
    d.winners = d.winners.filter(function (w) { return w !== id; });
    if (left.length === 1) { d.winners = [left[0]]; d.split = false; }
  } else {
    delete d.folded[id];
  }
  d.touched = true;
  save();
  render();
}

function pickWinner(id) {
  var d = S.draft;
  if (!d || d.folded[id]) return;
  if (d.split) {
    d.winners = d.winners.indexOf(id) > -1 ? d.winners.filter(function (w) { return w !== id; }) : d.winners.concat(id);
  } else {
    d.winners = (d.winners.length === 1 && d.winners[0] === id) ? [] : [id];
  }
  d.touched = true;
  save();
  render();
}

function onSplit(on) {
  var d = S.draft; if (!d) return;
  d.split = on;
  if (!on && d.winners.length > 1) d.winners = [d.winners[0]];
  d.touched = true;
  save();
  render();
}

function onDealer(v) {
  S.dealerOverride = null;
  var nat = positions();
  S.dealerOverride = (nat.ok && nat.button === v) ? null : v;
  save();
  render();
  toast(rawName(v) + ' is dealing this hand.');
}

function onAmtInput(inp) {
  var d = S.draft, id = inp.getAttribute('data-id');
  if (!d) return;
  var v = parseMoney(inp.value);
  if (v === null) return;
  d.bets[id] = v;
  d.touched = true;
  renderLive();
}

function onAmtCommit(inp) {
  var P = positions(), d = S.draft, id = inp.getAttribute('data-id');
  if (!P.ok || !d || P.active.indexOf(id) < 0) return;
  var prev = parseInt(inp.getAttribute('data-prev'), 10);
  if (!Number.isFinite(prev)) prev = d.bets[id] || 0;
  var v = parseMoney(inp.value);
  if (v === null) v = prev;
  var min = minBet(id, P);
  if (v < min) {
    v = min;
    toast(rawName(id) + ' posted the ' + (id === P.bb ? 'big' : 'small') + ' blind, so it can\u2019t be less than ' + fmt(min) + '.');
  }
  d.bets[id] = prev;
  setBet(id, v);
  inp.setAttribute('data-prev', String(d.bets[id]));
  inp.value = pounds(d.bets[id]);
  save();
  renderLive();
}

function commitFocusedAmount() {
  var ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains('amt-input')) { onAmtCommit(ae); ae.blur(); }
}

function record() {
  if (busy) return;
  commitFocusedAmount();
  var P = positions();
  if (!P.ok) return;
  var d = ensureDraft(P);
  var E = evalDraft(P, d);
  if (!E.ok) { toast('Tap who won first.'); return; }
  var n = S.hands.length + 1;
  var bets = {}, folded = {};
  P.active.forEach(function (id) { bets[id] = d.bets[id] || 0; if (d.folded[id]) folded[id] = true; });
  var hand = {
    id: uid(), ts: Date.now(),
    button: P.button, sbP: P.sb, bbP: P.bb, sbAmt: S.sb, bbAmt: S.bb,
    players: P.active.slice(), bets: bets, folded: folded,
    winners: E.winners.slice(), pot: E.pot, net: E.net
  };
  busy = true;
  var rb = $('#record-btn'); if (rb) rb.disabled = true;
  var felt = $('#felt'), wait = 0;
  if (felt && felt.getBoundingClientRect().top < -40) {
    felt.scrollIntoView({ behavior: REDUCE_MOTION ? 'auto' : 'smooth', block: 'start' });
    wait = REDUCE_MOTION ? 0 : 420;
  }
  setTimeout(function () { sweepChips(E.winners[0], finish); }, wait);
  function finish() {
    S.hands.push(hand);
    S.dealerOverride = null;
    S.draft = null;
    save();
    busy = false;
    var puck = $('#puck'); if (puck && !REDUCE_MOTION) puck.classList.add('animate');
    render();
    var who = E.winners.map(rawName).join(' & ');
    toast('Hand ' + n + ': ' + who + (E.winners.length > 1 ? ' split ' : ' won ') + fmt(E.pot) + '.', { action: 'Undo', onAction: undoLast });
  }
}

/* Chips slide to the winner, then the dealer button moves on. */
function sweepChips(winnerId, done) {
  var seatIdx = order().indexOf(winnerId);
  var target = $('.seat[data-seat="' + seatIdx + '"] .chip');
  var markers = $$('.bet.show');
  if (REDUCE_MOTION || !target || !markers.length) { done(); return; }
  var tr = target.getBoundingClientRect();
  var tx = tr.left + tr.width / 2, ty = tr.top + tr.height / 2;
  markers.forEach(function (m) {
    var r = m.getBoundingClientRect();
    var dx = tx - (r.left + r.width / 2), dy = ty - (r.top + r.height / 2);
    m.style.transition = 'transform .45s cubic-bezier(.5,0,.25,1), opacity .45s ease-in';
    m.style.transform = 'translate(calc(-50% + ' + dx.toFixed(1) + 'px), calc(-50% + ' + dy.toFixed(1) + 'px)) scale(.55)';
    m.style.opacity = '0';
  });
  setTimeout(function () {
    markers.forEach(function (m) {
      m.style.transition = 'none'; m.style.transform = ''; m.style.opacity = '';
      void m.offsetWidth;
      m.style.transition = '';
    });
    done();
  }, 470);
}

function undoLast() {
  var h = S.hands.pop();
  if (!h) { toast('There are no hands to undo.'); return; }
  var n = S.hands.length + 1;
  S.dealerOverride = null;
  var nat = positions();
  if (nat.ok && nat.button !== h.button) S.dealerOverride = h.button;
  var P = positions(), restored = false;
  if (P.ok && P.button === h.button && P.sb === h.sbP && P.bb === h.bbP && sameIds(P.active, h.players) && S.sb === h.sbAmt && S.bb === h.bbAmt) {
    var bets = {};
    P.active.forEach(function (id) { bets[id] = h.bets[id] || 0; });
    S.draft = { key: posKey(P), bets: bets, folded: Object.assign({}, h.folded || {}), winners: h.winners.slice(), split: h.winners.length > 1, hist: {}, touched: true };
    restored = true;
  } else {
    S.draft = null;
  }
  save();
  var puck = $('#puck'); if (puck && !REDUCE_MOTION) puck.classList.add('animate');
  render();
  toast(restored ? 'Hand ' + n + ' is back in the editor to fix.' : 'Hand ' + n + ' removed.');
}

function clearHand() {
  var P = positions();
  if (!P.ok) return;
  var prev = S.draft ? JSON.parse(JSON.stringify(S.draft)) : null;
  if (!prev || !prev.touched) { toast('Nothing to clear yet.'); return; }
  S.draft = newDraft(P);
  save();
  render();
  toast('Hand cleared.', { action: 'Undo', onAction: function () { S.draft = prev; save(); render(); } });
}

/* ---------- edit a past hand ---------- */
function editHand(hid) {
  var idx = S.hands.findIndex(function (h) { return h.id === hid; });
  if (idx < 0) return;
  var h = S.hands[idx], n = idx + 1;
  var winners = h.winners.slice();
  function minFor(id) { return id === h.bbP ? h.bbAmt : id === h.sbP ? h.sbAmt : 0; }
  function posFor(id) { return id === h.bbP ? 'BB' : id === h.sbP ? 'SB' : ''; }
  var html =
    '<p class="muted">' + new Date(h.ts).toLocaleString('en-GB', { weekday: 'short', hour: 'numeric', minute: '2-digit' }) + '. Dealer ' + nm(h.button) + '.</p>' +
    h.players.map(function (id) {
      var pos = posFor(id);
      return '<div class="edit-row"><span class="dot" style="--c:' + col(id) + '"></span><span class="pname">' + nm(id) + '</span>' +
        (pos ? '<span class="pos">' + pos + '</span>' : '') +
        '<label class="amt"><span aria-hidden="true">\u00A3</span><input class="edit-amt" data-eid="' + id + '" type="text" inputmode="decimal" autocomplete="off" value="' + pounds(h.bets[id] || 0) + '" aria-label="' + nm(id) + ' total put in"></label></div>';
    }).join('') +
    '<div class="edit-pot"><span class="muted">Pot</span><strong id="e-pot">' + fmt(h.pot) + '</strong></div>' +
    '<p class="sh">Who won? <span class="muted">(pick more than one for a split pot)</span></p>' +
    '<div class="winner-chips" id="e-winners">' + h.players.map(function (id) {
      return '<button type="button" class="wchip" data-ew="' + id + '" style="--c:' + col(id) + '" aria-pressed="' + (winners.indexOf(id) > -1) + '"><span class="dot" style="--c:' + col(id) + '"></span>' + nm(id) + '</button>';
    }).join('') + '</div>' +
    '<p class="err" id="e-err" role="alert"></p>';

  function readBets(sheet) {
    var bets = {}, bad = false;
    $$('.edit-amt', sheet).forEach(function (inp) {
      var v = parseMoney(inp.value);
      if (v === null) bad = true;
      bets[inp.getAttribute('data-eid')] = v === null ? 0 : v;
    });
    return bad ? null : bets;
  }

  openModal({
    title: 'Edit hand ' + n,
    html: html,
    mount: function (sheet) {
      sheet.addEventListener('input', function (e) {
        if (!e.target.classList.contains('edit-amt')) return;
        var bets = readBets(sheet);
        $('#e-pot', sheet).textContent = bets ? fmt(Object.keys(bets).reduce(function (a, k) { return a + bets[k]; }, 0)) : '\u2013';
      });
      sheet.addEventListener('click', function (e) {
        var b = e.target.closest('[data-ew]');
        if (!b) return;
        var id = b.getAttribute('data-ew');
        winners = winners.indexOf(id) > -1 ? winners.filter(function (w) { return w !== id; }) : winners.concat(id);
        b.setAttribute('aria-pressed', String(winners.indexOf(id) > -1));
      });
    },
    actions: [
      { label: 'Delete hand', kind: 'danger', onClick: function (close) {
          close();
          confirmBox('Delete hand ' + n + '?', 'It comes off everyone\u2019s profit and loss. Later hands are renumbered.', 'Delete hand', true).then(function (ok) {
            if (!ok) return;
            var i = S.hands.findIndex(function (x) { return x.id === hid; });
            if (i < 0) return;
            var removed = S.hands.splice(i, 1)[0];
            save(); render();
            toast('Hand ' + n + ' deleted.', { action: 'Undo', onAction: function () { S.hands.splice(i, 0, removed); save(); render(); } });
          });
          return false;
        } },
      { label: 'Cancel' },
      { label: 'Save changes', kind: 'primary', onClick: function (close, sheet) {
          var err = $('#e-err', sheet);
          var bets = readBets(sheet);
          if (!bets) { err.textContent = 'One of the amounts isn\u2019t a number. Use pounds, like 1.50.'; return false; }
          for (var k in bets) {
            if (bets[k] < minFor(k)) { err.textContent = rawName(k) + ' posted the blind, so it can\u2019t be less than ' + fmt(minFor(k)) + '.'; return false; }
          }
          if (!winners.length) { err.textContent = 'Pick who won.'; return false; }
          var pot = Object.keys(bets).reduce(function (a, k2) { return a + bets[k2]; }, 0);
          if (pot <= 0) { err.textContent = 'The pot can\u2019t be empty.'; return false; }
          var shares = distribute(pot, winners, h.button), net = {};
          h.players.forEach(function (id) { net[id] = (shares[id] || 0) - (bets[id] || 0); });
          var folded = Object.assign({}, h.folded || {});
          winners.forEach(function (w) { delete folded[w]; });
          Object.assign(h, { bets: bets, winners: winners.slice(), pot: pot, net: net, folded: folded });
          save(); render();
          toast('Hand ' + n + ' updated.');
        } }
    ]
  });
}

/* ---------- settings ---------- */
function openSettings() {
  var tmp = S.players.map(function (p) { return Object.assign({}, p); });
  var sbStr = pounds(S.sb), bbStr = pounds(S.bb);
  function body() {
    return '<p class="sh">Players</p>' +
      '<p class="muted" style="margin:0">In seat order, going clockwise. The dealer button and blinds move in this order.</p>' +
      tmp.map(function (p, i) {
        return '<div class="set-row"><span class="dot" style="--c:' + PALETTE[p.color] + '"></span>' +
          '<input class="field" data-n="' + i + '" value="' + esc(p.name) + '" maxlength="14" aria-label="Seat ' + (i + 1) + ' name" autocomplete="off">' +
          '<button type="button" class="icon-btn sm" data-mv="up" data-i="' + i + '"' + (i === 0 ? ' disabled style="opacity:.35"' : '') + ' aria-label="Move ' + esc(p.name) + ' up">' + ICON_UP + '</button>' +
          '<button type="button" class="icon-btn sm" data-mv="down" data-i="' + i + '"' + (i === tmp.length - 1 ? ' disabled style="opacity:.35"' : '') + ' aria-label="Move ' + esc(p.name) + ' down">' + ICON_DOWN + '</button></div>';
      }).join('') +
      '<p class="sh">Blinds</p>' +
      '<div class="set-blinds">' +
        '<label>Small blind<span class="money-field">\u00A3<input class="field" id="set-sb" inputmode="decimal" value="' + sbStr + '" autocomplete="off"></span></label>' +
        '<label>Big blind<span class="money-field">\u00A3<input class="field" id="set-bb" inputmode="decimal" value="' + bbStr + '" autocomplete="off"></span></label>' +
      '</div>' +
      '<p class="muted" style="margin-top:8px">New blinds apply from the next hand. Hands already recorded keep their own blinds.</p>' +
      '<p class="err" id="set-err" role="alert"></p>';
  }
  function readInputs(sheet) {
    $$('[data-n]', sheet).forEach(function (inp) { tmp[+inp.getAttribute('data-n')].name = inp.value; });
    sbStr = $('#set-sb', sheet).value; bbStr = $('#set-bb', sheet).value;
  }
  openModal({
    title: 'Settings',
    html: body(),
    mount: function (sheet) {
      sheet.addEventListener('click', function (e) {
        var b = e.target.closest('[data-mv]');
        if (!b || b.disabled) return;
        readInputs(sheet);
        var i = +b.getAttribute('data-i'), j = b.getAttribute('data-mv') === 'up' ? i - 1 : i + 1;
        var t = tmp[i]; tmp[i] = tmp[j]; tmp[j] = t;
        $('.sheet-body', sheet).innerHTML = body();
        var again = $('[data-mv="' + b.getAttribute('data-mv') + '"][data-i="' + j + '"]', sheet);
        if (again && !again.disabled) again.focus();
      });
    },
    actions: [
      { label: 'Cancel' },
      { label: 'Save settings', kind: 'primary', onClick: function (close, sheet) {
          readInputs(sheet);
          var err = $('#set-err', sheet);
          var names = tmp.map(function (p) { return p.name.trim(); });
          if (names.some(function (n) { return !n; })) { err.textContent = 'Every player needs a name.'; return false; }
          var lower = names.map(function (n) { return n.toLowerCase(); });
          if (lower.some(function (n, i) { return lower.indexOf(n) !== i; })) { err.textContent = 'Two players can\u2019t have the same name.'; return false; }
          var sb = parseMoney(sbStr), bb = parseMoney(bbStr);
          if (sb === null || bb === null || sb <= 0 || bb <= 0) { err.textContent = 'Blinds need to be amounts above \u00A30, like 0.10.'; return false; }
          if (bb < sb) { err.textContent = 'The big blind can\u2019t be smaller than the small blind.'; return false; }
          S.players = tmp.map(function (p, i) { return { id: p.id, name: names[i], color: p.color }; });
          S.sb = sb; S.bb = bb;
          save(); render();
          toast('Settings saved.');
        } }
    ]
  });
}

/* ---------- sessions ---------- */
function newSession() {
  if (!S.hands.length) { toast('Record a hand first. There\u2019s nothing to save yet.'); return; }
  var tx = settle(sessionNet());
  var owed = tx.length ? ' Before you do, make sure everyone has paid: ' + tx.map(function (t) { return nm(t.from) + ' pays ' + nm(t.to) + ' ' + fmt(t.amt); }).join(', ') + '.' : '';
  confirmBox('Start a new session?',
    'This saves the current ' + plural(S.hands.length, 'hand') + ' under Past sessions and clears the table.' + owed,
    'Start new session').then(function (ok) {
      if (!ok) return;
      var st = statsFor(S.hands), net = {}, names = {};
      S.players.forEach(function (p) { net[p.id] = st.per[p.id].net; names[p.id] = p.name; });
      S.archive.unshift({
        id: uid(), start: S.hands[0].ts, end: S.hands[S.hands.length - 1].ts,
        hands: S.hands.length, net: net, names: names, biggest: st.biggest, volume: st.volume,
        log: S.hands
      });
      var lastBtn = S.hands[S.hands.length - 1].button;
      S.startDealer = nextIn(lastBtn) || lastBtn;
      S.hands = []; S.draft = null; S.dealerOverride = null; S.sessionStart = Date.now();
      save(); render();
      toast('New session started. The last one is saved under Past sessions.');
    });
}

function openSessions() {
  var all = allTimeNet();
  var ids = order().slice().sort(function (a, b) { return all[b] - all[a]; });
  var html =
    '<p class="sh">All time, ' + plural(allTimeHands(), 'hand') + '</p>' +
    '<div class="alltime">' + ids.map(function (id) {
      return '<div><span><span class="dot" style="--c:' + col(id) + '"></span>' + nm(id) + '</span><strong class="' + tone(all[id]) + '">' + fmtS(all[id]) + '</strong></div>';
    }).join('') + '</div>' +
    '<p class="sh">Past sessions</p>' +
    (S.archive.length ? S.archive.map(function (a) {
      return '<div class="sess"><div class="sess-top"><span class="sess-date">' + dateStr(a.start) + ', ' + timeStr(a.start) + ' to ' + timeStr(a.end) + '</span>' +
        '<button type="button" class="btn-text sm" data-del="' + esc(a.id) + '">Delete</button></div>' +
        '<div class="muted">' + plural(a.hands, 'hand') + (a.biggest ? ', biggest pot ' + fmt(a.biggest) : '') + '</div>' +
        '<div class="sess-nets">' + order().map(function (id) {
          var v = a.net[id] || 0;
          return '<span><span class="dot" style="--c:' + col(id) + '"></span>' + nm(id) + ' <b class="' + tone(v) + '">' + fmtS(v) + '</b></span>';
        }).join('') + '</div></div>';
    }).join('') : '<p class="muted">None yet. Use Start new session at the end of a night to save it here.</p>');
  openModal({
    title: 'Past sessions',
    html: html,
    mount: function (sheet, close) {
      sheet.addEventListener('click', function (e) {
        var b = e.target.closest('[data-del]');
        if (!b) return;
        var sid = b.getAttribute('data-del');
        close();
        confirmBox('Delete this session?', 'It comes off the all-time totals. This can\u2019t be undone.', 'Delete session', true).then(function (ok) {
          if (!ok) { openSessions(); return; }
          S.archive = S.archive.filter(function (a) { return a.id !== sid; });
          if (!S.archive.length) S.owesView = 'session';
          save(); render();
          toast('Session deleted.');
          openSessions();
        });
      });
    },
    actions: [{ label: 'Done', kind: 'primary' }]
  });
}

/* ---------- sharing and files ---------- */
function summaryText() {
  var view = S.archive.length ? S.owesView : 'session';
  var net = view === 'all' ? allTimeNet() : sessionNet();
  var lines = ['FLAT 1 POKER, ' + dateStr(Date.now())];
  lines.push(view === 'all'
    ? 'All time, ' + plural(allTimeHands(), 'hand')
    : plural(S.hands.length, 'hand') + ', blinds ' + fmt(S.sb) + '/' + fmt(S.bb));
  lines.push('');
  order().slice().sort(function (a, b) { return net[b] - net[a]; }).forEach(function (id) {
    lines.push(rawName(id) + ': ' + fmtS(net[id]));
  });
  lines.push('');
  var tx = settle(net);
  if (tx.length) tx.forEach(function (t) { lines.push(rawName(t.from) + ' pays ' + rawName(t.to) + ' ' + fmt(t.amt)); });
  else lines.push('All square.');
  return lines.join('\n');
}
function share() {
  var text = summaryText();
  function fallback() {
    openModal({ title: 'Summary', html: '<p class="muted">Copy this into the group chat.</p><textarea class="field" readonly rows="10">' + esc(text) + '</textarea>', actions: [{ label: 'Done', kind: 'primary' }],
      mount: function (sheet) { var t = $('textarea', sheet); t.focus(); t.select(); } });
  }
  if (navigator.share) {
    navigator.share({ text: text }).catch(function (e) { if (e && e.name !== 'AbortError') fallback(); });
    return;
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function () { toast('Summary copied. Paste it in the group chat.'); }, fallback);
    return;
  }
  fallback();
}
function download(name, type, text) {
  var blob = new Blob([text], { type: type });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function csvCell(v) { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV() {
  if (!S.hands.length) { toast('No hands to export yet.'); return; }
  var ids = order();
  var head = ['Hand', 'Time', 'Dealer', 'Small blind', 'Big blind']
    .concat(ids.map(function (id) { return rawName(id) + ' put in'; }))
    .concat(['Pot', 'Winner'])
    .concat(ids.map(function (id) { return rawName(id) + ' P/L'; }));
  var rows = S.hands.map(function (h, i) {
    return [i + 1, new Date(h.ts).toLocaleString('en-GB'), rawName(h.button), rawName(h.sbP), rawName(h.bbP)]
      .concat(ids.map(function (id) { return h.players.indexOf(id) > -1 ? (h.bets[id] / 100).toFixed(2) : 'out'; }))
      .concat([(h.pot / 100).toFixed(2), h.winners.map(rawName).join(' & ')])
      .concat(ids.map(function (id) { return h.players.indexOf(id) > -1 ? ((h.net[id] || 0) / 100).toFixed(2) : ''; }));
  });
  var csv = '\ufeff' + [head].concat(rows).map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
  download('flat1-poker-hands-' + isoDate(Date.now()) + '.csv', 'text/csv;charset=utf-8', csv);
  toast('Hands exported.');
}
function backup() {
  download('flat1-poker-backup-' + isoDate(Date.now()) + '.json', 'application/json',
    JSON.stringify({ app: 'flat1-poker', saved: Date.now(), state: S }, null, 1));
  toast('Backup saved. Keep the file somewhere safe.');
}
function onRestore(input) {
  var f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    var data;
    try { data = JSON.parse(reader.result); } catch (e) { toast('That file isn\u2019t a Flat 1 Poker backup.'); return; }
    var raw = data && data.state ? data.state : data;
    if (!raw || !Array.isArray(raw.hands)) { toast('That file isn\u2019t a Flat 1 Poker backup.'); return; }
    var next = sanitize(raw);
    var when = data.saved ? ' from ' + dateStr(data.saved) : '';
    confirmBox('Restore backup' + when + '?',
      'It has ' + plural(next.hands.length, 'hand') + ' in the current session and ' + plural(next.archive.length, 'past session') + '. Everything on this device is replaced.',
      'Restore backup', true).then(function (ok) {
        if (!ok) return;
        S = next; save(); tableBuilt = false; render();
        toast('Backup restored.');
      });
  };
  reader.readAsText(f);
}

/* ---------- keep screen on ---------- */
var wakeLock = null, wantWake = false;
function setWake(on) {
  wantWake = on;
  if (on) {
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l;
      l.addEventListener('release', function () { wakeLock = null; renderMenu(); });
      renderMenu();
      toast('The screen will stay on while this page is open.');
    }).catch(function () { wantWake = false; toast('This browser won\u2019t keep the screen on.'); });
  } else {
    if (wakeLock) wakeLock.release();
    wakeLock = null;
    renderMenu();
    toast('The screen can sleep again.');
  }
}
document.addEventListener('visibilitychange', function () {
  if (wantWake && !wakeLock && document.visibilityState === 'visible') {
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l; l.addEventListener('release', function () { wakeLock = null; renderMenu(); }); renderMenu();
    }).catch(function () {});
  }
});

/* =========================================================
   Toast and modal
   ========================================================= */
var toastTimer = null;
function toast(msg, opt) {
  opt = opt || {};
  var t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (opt.action ? '<button type="button" class="toast-act">' + esc(opt.action) + '</button>' : '');
  if (opt.action) {
    $('.toast-act', t).onclick = function () { hideToast(); opt.onAction(); };
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, opt.action ? 6500 : 3800);
}
function hideToast() { $('#toast').classList.remove('show'); }

function openModal(o) {
  hideToast();
  var back = document.createElement('div');
  back.className = 'modal-back';
  var actions = o.actions || [];
  back.innerHTML =
    '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title" tabindex="-1">' +
      '<div class="sheet-head"><h2 id="m-title">' + esc(o.title) + '</h2>' +
        '<button type="button" class="icon-btn sm m-close" aria-label="Close">' + ICON_CLOSE + '</button></div>' +
      '<div class="sheet-body">' + o.html + '</div>' +
      (actions.length ? '<div class="sheet-actions">' + actions.map(function (a, i) {
        var cls = a.kind === 'primary' ? 'btn-primary' : a.kind === 'danger' ? 'btn-danger' : 'btn-ghost';
        return '<button type="button" class="' + cls + '" data-ai="' + i + '">' + esc(a.label) + '</button>';
      }).join('') + '</div>' : '') +
    '</div>';
  var prevFocus = document.activeElement;
  document.body.appendChild(back);
  document.body.classList.add('modal-open');
  var sheet = $('.sheet', back);
  var closed = false;
  function close() {
    if (closed) return;
    closed = true;
    document.removeEventListener('keydown', onKey, true);
    back.remove();
    if (!$('.modal-back')) document.body.classList.remove('modal-open');
    if (o.onClose) o.onClose();
    if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus();
  }
  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); return; }
    if (e.key === 'Tab') {
      var f = $$('button:not([disabled]), input, select, textarea, [tabindex="0"]', sheet).filter(function (x) { return x.offsetParent !== null; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  document.addEventListener('keydown', onKey, true);
  back.addEventListener('click', function (e) { if (e.target === back) close(); });
  $('.m-close', back).onclick = close;
  actions.forEach(function (a, i) {
    $('[data-ai="' + i + '"]', back).onclick = function () {
      var r = a.onClick ? a.onClick(close, sheet) : undefined;
      if (r !== false) close();
    };
  });
  if (o.mount) o.mount(sheet, close);
  var firstField = $('.sheet-body input:not([readonly])', sheet);
  if (firstField && !('ontouchstart' in window)) firstField.focus(); else sheet.focus();
  return close;
}

function confirmBox(title, text, label, danger) {
  return new Promise(function (resolve) {
    var answered = false;
    openModal({
      title: title,
      html: '<p>' + text + '</p>',
      onClose: function () { if (!answered) resolve(false); },
      actions: [
        { label: 'Cancel' },
        { label: label, kind: danger ? 'danger' : 'primary', onClick: function () { answered = true; resolve(true); } }
      ]
    });
  });
}

/* =========================================================
   Dropdowns
   ========================================================= */
function openDD(btn) {
  closeDDs();
  var menu = document.getElementById(btn.getAttribute('aria-controls'));
  menu.hidden = false;
  btn.setAttribute('aria-expanded', 'true');
  var first = $('.mi', menu);
  if (first) first.focus();
}
function closeDDs(returnFocus) {
  $$('.dd-menu').forEach(function (m) {
    if (m.hidden) return;
    m.hidden = true;
    var b = $('[aria-controls="' + m.id + '"]');
    if (b) { b.setAttribute('aria-expanded', 'false'); if (returnFocus) b.focus(); }
  });
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', function (e) {
  var ddBtn = e.target.closest('[data-dd]');
  if (ddBtn) {
    var menu = document.getElementById(ddBtn.getAttribute('aria-controls'));
    if (menu.hidden) openDD(ddBtn); else closeDDs();
    return;
  }
  if (!e.target.closest('.dd-menu')) closeDDs();
  var a = e.target.closest('[data-action]');
  if (!a || a.disabled) return;
  var id = a.getAttribute('data-id');
  var inMainMenu = !!a.closest('#main-menu');
  if (inMainMenu) closeDDs();
  switch (a.getAttribute('data-action')) {
    case 'toggle-out': toggleOut(id); break;
    case 'open-sitout': openDD($('#sitout-btn')); break;
    case 'add': setBet(id, (S.draft.bets[id] || 0) + parseInt(a.getAttribute('data-amt'), 10)); renderLive(); break;
    case 'call': {
      var P = positions(), E = evalDraft(P, S.draft);
      setBet(id, E.max); renderLive(); break;
    }
    case 'undo-bet': {
      var d = S.draft, h = d && d.hist[id];
      if (h && h.length) { d.bets[id] = h.pop(); d.touched = true; save(); }
      else { setBet(id, 0, false); }
      renderLive(); break;
    }
    case 'fold': toggleFold(id); break;
    case 'win': pickWinner(id); break;
    case 'record': record(); break;
    case 'clear-hand': clearHand(); break;
    case 'auto-dealer': S.dealerOverride = null; save(); render(); toast('Back to the normal rotation.'); break;
    case 'owes-view': S.owesView = a.getAttribute('data-view'); save(); renderOwes(); break;
    case 'share': share(); break;
    case 'undo-hand': undoLast(); break;
    case 'edit-hand': editHand(a.getAttribute('data-hid')); break;
    case 'export-csv': exportCSV(); break;
    case 'backup': backup(); break;
    case 'restore': $('#restore-file').click(); break;
    case 'settings': openSettings(); break;
    case 'sessions': openSessions(); break;
    case 'new-session': newSession(); break;
    case 'wake': setWake(!wakeLock); break;
  }
});

document.addEventListener('input', function (e) {
  if (e.target.classList && e.target.classList.contains('amt-input')) onAmtInput(e.target);
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.classList && t.classList.contains('amt-input')) onAmtCommit(t);
  else if (t.id === 'split-toggle') onSplit(t.checked);
  else if (t.id === 'dealer-select') onDealer(t.value);
  else if (t.id === 'restore-file') onRestore(t);
});
document.addEventListener('focusin', function (e) {
  var t = e.target;
  if (t.classList && (t.classList.contains('amt-input') || t.classList.contains('edit-amt'))) {
    if (t.classList.contains('amt-input') && S.draft) t.setAttribute('data-prev', String(S.draft.bets[t.getAttribute('data-id')] || 0));
    setTimeout(function () { try { t.select(); } catch (err) {} }, 0);
  }
});
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (e.key === 'Enter' && t.classList && t.classList.contains('amt-input')) { e.preventDefault(); t.blur(); return; }
  var menu = t.closest && t.closest('.dd-menu');
  if (menu) {
    var items = $$('.mi', menu), i = items.indexOf(t);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeDDs(true); }
    else if (e.key === 'Tab') { closeDDs(); }
  } else if (e.key === 'Escape') {
    closeDDs();
  }
});

var resizeTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderChart, 120);
});
/* Another tab or device window changed the data: pick it up. */
window.addEventListener('storage', function (e) {
  if (e.key !== KEY || !e.newValue) return;
  try { S = sanitize(JSON.parse(e.newValue)); render(); } catch (err) {}
});

render();
})();
</script>
